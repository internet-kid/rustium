<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rustium — main window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#b4abff}a:hover{color:#d4ceff}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 840px; display: flex; flex-direction: column; background: #0e0f13; color: #eceef3; font-family: Geist, system-ui, sans-serif; font-size: 13px; border-radius: 12px; overflow: hidden">

  <div style="position: relative; height: 38px; display: flex; align-items: flex-end; gap: 2px; padding: 0 8px 0 104px; flex: none">
    <div aria-hidden="true" style="position: absolute; left: 16px; top: 13px; display: flex; gap: 8px">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
    </div>
    <div role="tablist" aria-label="Tabs" style="display: flex; align-items: flex-end; gap: 2px; min-width: 0">
      <div role="tab" aria-selected="true" style="width: 220px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; box-sizing: border-box; border-radius: 9px 9px 0 0; background: #1d2027; color: #eceef3">
        <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; background: #3b82f6; color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; flex: none">D</span>
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500">cef — Rust bindings for CEF</span>
        <button aria-label="Close tab" style="width: 20px; height: 20px; flex: none; border: 0; padding: 0; border-radius: 6px; background: transparent; color: #9aa0ad; display: grid; place-items: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
      </div>
      <div role="tab" aria-selected="false" style="width: 220px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; box-sizing: border-box; border-radius: 9px 9px 0 0; color: #9aa0ad">
        <span aria-hidden="true" style="width: 12px; height: 12px; margin: 0 2px; border-radius: 50%; border: 2px solid rgba(255,255,255,.1); border-top-color: {{accent}}; box-sizing: border-box; flex: none"></span>
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Loading…</span>
      </div>
      <div role="tab" aria-selected="false" style="width: 220px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; box-sizing: border-box; border-radius: 9px 9px 0 0; color: #9aa0ad">
        <span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; background: #dc2626; color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; flex: none">V</span>
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">RustConf 2026 — Keynote</span>
        <button aria-label="Mute tab" style="width: 20px; height: 20px; flex: none; border: 0; padding: 0; border-radius: 6px; background: transparent; color: #c9cdd6; display: grid; place-items: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M17 9a4 4 0 0 1 0 6"></path></svg></button>
      </div>
      <div role="tab" aria-selected="false" style="width: 220px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; box-sizing: border-box; border-radius: 9px 9px 0 0; color: #9aa0ad">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">localhost:8080</span>
      </div>
    </div>
    <button aria-label="New tab" style="width: 28px; height: 28px; margin: 0 0 3px 2px; flex: none; border: 0; padding: 0; border-radius: 8px; background: transparent; color: #9aa0ad; display: grid; place-items: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div style="position: relative; height: 42px; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: #1d2027; flex: none">
    <button aria-label="Back" style="width: 30px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: #c9cdd6; display: grid; place-items: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
    <button aria-label="Forward" disabled="" style="width: 30px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: #4a4f5c; display: grid; place-items: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    <button aria-label="Stop loading" style="width: 30px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: #c9cdd6; display: grid; place-items: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
    <div style="flex: 1; min-width: 0; height: 30px; margin: 0 6px; padding: 0 6px 0 4px; display: flex; align-items: center; gap: 6px; border-radius: 9px; background: #121419">
      <button aria-label="Connection is secure — site information" style="height: 24px; padding: 0 7px; border: 0; border-radius: 7px; background: transparent; color: #9aa0ad; display: flex; align-items: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></button>
      <label style="flex: 1; min-width: 0; display: flex; align-items: center; font-size: 13.5px; white-space: nowrap; overflow: hidden">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Address</span>
        <span style="color: #9aa0ad">https://</span><span style="color: #eceef3">docs.rs</span><span style="color: #9aa0ad">/cef/156.4.0/cef/</span>
      </label>
      <button aria-label="Bookmark this page" style="width: 26px; height: 26px; border: 0; padding: 0; border-radius: 7px; background: transparent; color: #9aa0ad; display: grid; place-items: center"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button>
    </div>
    <button aria-label="Downloads" style="width: 30px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: #c9cdd6; display: grid; place-items: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
    <button aria-label="Main menu" style="width: 30px; height: 30px; border: 0; padding: 0; border-radius: 8px; background: transparent; color: #c9cdd6; display: grid; place-items: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    <div role="progressbar" aria-label="Page loading" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" style="position: absolute; left: 0; bottom: 0; width: 62%; height: 2px; background: {{accent}}"></div>
  </div>

  <main aria-label="Web page (placeholder)" style="flex: 1; display: flex; background: #16181e; border-top: 1px solid rgba(255,255,255,.05)">
    <div style="width: 240px; padding: 32px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid rgba(255,255,255,.05)">
      <div style="width: 120px; height: 10px; border-radius: 4px; background: #2a2e37"></div>
      <div style="width: 90px; height: 9px; border-radius: 4px; background: #22252d"></div>
      <div style="width: 150px; height: 9px; border-radius: 4px; background: #22252d"></div>
      <div style="width: 110px; height: 9px; border-radius: 4px; background: #22252d"></div>
      <div style="width: 140px; height: 9px; border-radius: 4px; background: #22252d"></div>
    </div>
    <div style="flex: 1; padding: 44px 56px; display: flex; flex-direction: column; gap: 14px">
      <div style="width: 340px; height: 26px; border-radius: 6px; background: #2a2e37"></div>
      <div style="width: 620px; height: 10px; border-radius: 4px; background: #22252d"></div>
      <div style="width: 580px; height: 10px; border-radius: 4px; background: #22252d"></div>
      <div style="width: 680px; height: 160px; border-radius: 10px; background: #1b1d23; margin-top: 10px"></div>
      <div style="width: 600px; height: 10px; border-radius: 4px; background: #22252d; margin-top: 10px"></div>
      <div style="width: 520px; height: 10px; border-radius: 4px; background: #22252d"></div>
      <div style="width: 560px; height: 10px; border-radius: 4px; background: #22252d"></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8b7cff","options":["#8b7cff","#5ee6b8","#60a5fa","#ff8a65"]},"$preview":{"width":1280,"height":840}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#8b7cff' };
  }
}
</script>
</body>
</html>
