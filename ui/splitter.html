<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Rustium splitter</title>
<style>
  /* The thin bar between the page and docked DevTools (src/shell/devtools.rs).
     Background = Role::Splitter in src/shell.rs. */
  :root { --bar: #1d2027; --line: rgba(255, 255, 255, .08); --accent: #8b7cff; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bar);
    overflow: hidden;
    cursor: col-resize;
    user-select: none;
    -webkit-user-select: none;
  }
  .bottom, .bottom body { cursor: row-resize; }
  #line { position: absolute; inset: 0; margin: auto; background: var(--line); }
  html:not(.bottom) #line { width: 1px; }
  .bottom #line { height: 1px; }
  .dragging #line, body:hover #line { background: var(--accent); }
</style>
</head>
<body>
<div id="line"></div>
<script>
'use strict';

function send(cmd, extra = {}) {
  if (typeof window.cefQuery !== 'function') return;
  window.cefQuery({
    request: JSON.stringify({ cmd, ...extra }),
    onSuccess() {},
    onFailure(code, message) { console.error(`${cmd}: ${code} ${message}`); },
  });
}

window.rustium = {
  update(state) {
    document.documentElement.classList.toggle('bottom', state.devtoolsDock === 'bottom');
  },
};

// Screen coordinates stay put while Rust moves this view under the cursor.
let last = null;
let pending = { dx: 0, dy: 0 };
let frame = 0;

function flush() {
  frame = 0;
  if (pending.dx || pending.dy) send('splitterMove', pending);
  pending = { dx: 0, dy: 0 };
}

document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  document.body.setPointerCapture(e.pointerId);
  document.documentElement.classList.add('dragging');
  last = { x: e.screenX, y: e.screenY };
});
document.addEventListener('pointermove', (e) => {
  if (!last) return;
  pending.dx += e.screenX - last.x;
  pending.dy += e.screenY - last.y;
  last = { x: e.screenX, y: e.screenY };
  if (!frame) frame = requestAnimationFrame(flush);
});
function stop() {
  if (!last) return;
  last = null;
  document.documentElement.classList.remove('dragging');
  flush();
}
document.addEventListener('pointerup', stop);
document.addEventListener('pointercancel', stop);
document.addEventListener('contextmenu', (e) => e.preventDefault());

window.cefQuery && window.cefQuery({
  request: JSON.stringify({ cmd: 'ready' }),
  onSuccess(json) { window.rustium.update(JSON.parse(json)); },
  onFailure() {},
});
</script>
</body>
</html>
