<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  /*@font-geist*/
  /* Tokens: docs/design/Components.dc.html (dark theme). */
  :root {
    color-scheme: dark;
    --bg: #16181e;
    --fg: #eceef3;
    --dim: #9aa0ad;
    --field: #1d2027;
    --accent: #8b7cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 Geist, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  }
  main { width: min(560px, 90vw); text-align: center; margin-top: -10vh; }
  h1 {
    margin: 0 0 28px;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--accent); }
  form { display: flex; }
  input {
    flex: 1;
    height: 46px;
    padding: 0 20px;
    border: 0;
    border-radius: 23px;
    outline: none;
    background: var(--field);
    color: var(--fg);
    font: inherit;
  }
  input:focus { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  input::placeholder { color: #6b7180; }
  ul {
    list-style: none;
    padding: 0;
    margin: 28px 0 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
    color: var(--dim);
    font-size: 13px;
  }
  kbd { font: inherit; padding: 1px 6px; border-radius: 5px; background: var(--field); }
</style>
</head>
<body>
<main>
  <h1>Rust<span>ium</span></h1>
  <form action="{{search_action}}" method="get">
    <input name="q" type="search" placeholder="Search with {{search_name}}" autocomplete="off">
  </form>
  <ul id="hints"></ul>
</main>
<script>
  const m = navigator.platform.toUpperCase().includes('MAC') ? '⌘' : 'Ctrl+';
  const hints = [
    [m + 'T', 'new tab'],
    [m + 'W', 'close tab'],
    [m + 'L', 'address bar'],
    ['Ctrl+Tab', 'next tab'],
    ['F12', 'developer tools'],
  ];
  const list = document.getElementById('hints');
  for (const [key, text] of hints) {
    const li = document.createElement('li');
    const kbd = document.createElement('kbd');
    kbd.textContent = key;
    li.append(kbd, ' ' + text);
    list.append(li);
  }
</script>
</body>
</html>
