<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Error</title>
<!-- Error pages: rustium://error/?kind=…&url=…&code=…

     the mockup's content column; {{…}} are filled in by the script). -->
<style>
  /*@font-geist*/
  :root {
    --accent: #8b7cff;
    --accent-soft: #8b7cff2e;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    box-sizing: border-box;
    background: #16181e;
    color: #eceef3;
    font: 13px/1.4 Geist, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  }
  a { color: #b4abff; }
  a:hover { color: #d4ceff; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #page > div { max-width: 100%; }
  #details {
    margin: 14px auto 0;
    max-width: 560px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #1d2027;
    border: 1px solid rgba(255,255,255,.06);
    color: #9aa0ad;
    font: 11.5px/1.6 "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-all;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

        <li style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #1d2027; border: 1px solid rgba(255,255,255,.06)">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg></span>

          <span style="position: absolute; left: -24px; top: -14px; width: 140px; height: 140px; box-sizing: border-box; border-radius: 50%; border: 1px dashed rgba(255,255,255,.1)"></span>
          <span style="position: absolute; left: 14px; top: 6px; width: 76px; height: 98px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.05); transform: rotate(6deg)"></span>
          <div style="position: absolute; left: 6px; top: 6px; width: 76px; height: 98px; box-sizing: border-box; border-radius: 12px 22px 12px 12px; border: 2px dashed #4a4f5c; background: #16181e; display: grid; place-items: center">
            <span style="font-size: 38px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; color: #9aa0ad">?</span>
          </div>
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#4a4f5c" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" style="position: absolute; left: 56px; top: 6px"><path d="M2 2v10a4 4 0 0 0 4 4h10"></path></svg>
          <span style="position: absolute; right: -6px; bottom: 0; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; background: #2a2418; border: 3px solid #16181e; box-shadow: 0 0 0 1px rgba(251,191,36,.45); display: grid; place-items: center; color: #fbbf24"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg></span>
        </div>
      </div>

      <h1 id="err-title" style="margin: 26px 0 0; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.03em">File not found</h1>
      <p style="margin: 10px 0 0; max-width: 500px; font-size: 14.5px; line-height: 1.55; color: #c9cdd6">There’s no <strong style="color: #eceef3; font-weight: 600">{{file}}</strong> at this location. The file may have been moved, renamed or deleted.</p>

      <div style="margin-top: 16px; width: 100%; height: 40px; box-sizing: border-box; padding: 0 6px 0 14px; display: flex; align-items: center; gap: 10px; border-radius: 10px; background: #121419; border: 1px solid rgba(255,255,255,.08); text-align: left">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa0ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <code style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #9aa0ad">{{dir}}<span style="color: #eceef3">{{file}}</span></code>
        <button aria-label="Copy path" style="height: 28px; padding: 0 10px; flex: none; border: 0; border-radius: 7px; background: #1d2027; color: #c9cdd6; font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>Copy</button>
      </div>

      <h2 style="margin: 28px 0 10px; align-self: flex-start; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #9aa0ad">What you can try</h2>
      <ul style="list-style: none; margin: 0; padding: 0; width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: left">
        <li style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #1d2027; border: 1px solid rgba(255,255,255,.06)">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; font-weight: 500">Open the folder</span><span style="font-size: 12px; line-height: 1.45; color: #9aa0ad">The file may now have a different name</span></span>
        </li>
        <li style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #1d2027; border: 1px solid rgba(255,255,255,.06)">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; font-weight: 500">Check the Trash</span><span style="font-size: 12px; line-height: 1.45; color: #9aa0ad">Restore the file if it was deleted</span></span>
        </li>
        <li style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: #1d2027; border: 1px solid rgba(255,255,255,.06)">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5M12 19h8"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; font-weight: 500">Rebuild the docs</span><span style="font-size: 12px; line-height: 1.45; color: #9aa0ad">Generated files reappear after a build</span></span>
        </li>
      </ul>

      <div style="margin-top: 28px; display: flex; gap: 10px; justify-content: center">
        <button style="height: 36px; padding: 0 18px; border: 0; border-radius: 9px; background: var(--accent); color: #0e0f13; font: inherit; font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg>Reload</button>
        <button style="height: 36px; padding: 0 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px; background: transparent; color: #eceef3; font: inherit; font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Open folder…</button>
      </div>

      <div style="margin-top: 26px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #9aa0ad">
        <code style="height: 22px; padding: 0 8px; display: inline-flex; align-items: center; border-radius: 6px; background: #1d2027; border: 1px solid rgba(255,255,255,.06); font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: #c9cdd6">{{code}}</code>
        <span aria-hidden="true" style="color: #4a4f5c">·</span>
        <button aria-expanded="false" style="border: 0; padding: 0; background: transparent; color: #9aa0ad; font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(154,160,173,.4)">Details<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      </div>

    </div>
</template>

<script>
'use strict';

const params = new URLSearchParams(location.search);
const kind = params.get('kind') || 'refused';
const url = params.get('url') || '';
const code = params.get('code') || '';
const raw = params.get('raw') || '';
const isMac = navigator.platform.toUpperCase().includes('MAC');

let parsed = null;
try { parsed = new URL(url); } catch (e) { parsed = null; }
const host = parsed ? parsed.host || parsed.pathname : url;
const hostname = parsed ? parsed.hostname : url;
const port = parsed ? (parsed.port || (parsed.protocol === 'https:' ? '443' : '80')) : '';

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---- Talking to the browser (only a few commands are allowed from here) ----
function send(cmd, extra = {}) {
  if (typeof window.cefQuery !== 'function') return;
  window.cefQuery({
    request: JSON.stringify({ cmd, ...extra }),
    onSuccess() {},
    onFailure(c, m) { console.error(cmd, c, m); },
  });
}

// ---- Values for the template ----
const fmtDate = (secs) => new Date(secs * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const values = { host: kind === 'refused' ? hostname : host, code, port, url_short: url.replace(/^[a-z]+:\/\//i, ''), detail: raw };

if (kind === 'file') {
  const path = parsed ? decodeURIComponent(parsed.pathname) : url;
  const cut = path.lastIndexOf('/') + 1;
  values.dir = path.slice(0, cut);
  values.file = path.slice(cut) || path;
}
if (kind === 'cert') {
  const from = Number(params.get('from')) || 0;
  const to = Number(params.get('to')) || 0;
  values.host = hostname;
  values.issuer = params.get('issuer') || 'Unknown issuer';
  values.valid_from = from ? fmtDate(from) : '—';
  values.valid_to = to ? fmtDate(to) : '—';
  const now = Date.now() / 1000;
  if (to && to < now) values.expired_ago = `expired ${Math.round((now - to) / 86400)} days ago`;
  else if (from && from > now) values.expired_ago = `valid in ${Math.round((from - now) / 86400)} days`;
  else values.expired_ago = '';
}

const template = document.getElementById(`t-${kind}`) || document.getElementById('t-refused');
const page = document.getElementById('page');
page.innerHTML = template.innerHTML.replace(/\{\{(\w+)\}\}/g, (_, k) => escapeHtml(values[k] ?? ''));

// ---- Texts that depend on the exact error ----
function setTitle(text) { const h = page.querySelector('h1'); if (h) h.textContent = text; }
function setLead(html) { const p = page.querySelector('h1 + p'); if (p) p.innerHTML = html; }
const strong = (s) => `<strong style="color: #eceef3; font-weight: 600">${escapeHtml(s)}</strong>`;

if (kind === 'refused') {
  const local = ['localhost', '127.0.0.1', '[::1]'].includes(hostname);
  if (/TIMED_OUT/.test(code)) {
    setTitle(`${hostname} took too long to respond`);
    setLead(`The connection to ${strong(hostname)} timed out. The site may be down or overloaded.`);
  } else if (!/REFUSED/.test(code)) {
    setTitle(`Can’t reach ${hostname}`);
    setLead(`The connection to ${strong(hostname)} was interrupted or couldn’t be made.`);
  } else if (!local) {
    setTitle(`${hostname} refused to connect`);
  }
  if (!local) {
    // The dev-server tips only make sense for localhost.
    const tips = page.querySelector('ul');
    if (tips) {
      const titles = ['Check your connection', 'Try again later', 'Firewall or proxy'];
      const texts = ['Make sure other sites open normally', 'The site may be temporarily down', 'Make sure nothing blocks the connection'];
      tips.querySelectorAll('li').forEach((li, i) => {
        const spans = li.querySelectorAll(':scope > span:last-child > span');
        if (spans[0]) spans[0].textContent = titles[i] || '';
        if (spans[1]) spans[1].textContent = texts[i] || '';
      });
    }
  }
}
if (kind === 'cert') {
  const heading = page.querySelector('section h2');
  const reasons = [
    [/DATE_INVALID/, 'This site’s security certificate has expired or isn’t valid yet'],
    [/AUTHORITY_INVALID/, 'This site’s security certificate isn’t trusted'],
    [/COMMON_NAME_INVALID/, 'This certificate is for a different site'],
    [/REVOKED/, 'This site’s security certificate was revoked'],
  ];
  const reason = (reasons.find(([re]) => re.test(code)) || [null, 'This site’s security certificate has a problem'])[1];
  if (heading) heading.textContent = reason;
  if (!/DATE_INVALID/.test(code)) {
    const p = page.querySelector('section p');
    if (p) p.innerHTML = `Rustium can’t confirm that this is really ${strong(hostname)}. The certificate check failed with ${escapeHtml(code)}.`;
  }
}

// ---- Buttons, matched by their label in the mockup ----
const label = (el) => el.textContent.replace(/\s+/g, ' ').trim();
const actions = {
  'Try again': () => send('retry'),
  'Reload': () => send('retry'),
  'Go back': () => history.length > 1 ? history.back() : send('retry'),
  'Search instead': () => { location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(host); },
  'Network settings': () => send('networkSettings'),
  'Back to safety': () => history.length > 1 ? history.back() : (location.href = 'rustium://newtab/'),
  'Open folder…': () => send('revealFile', { url }),
  'Copy': (el) => navigator.clipboard.writeText(values.dir + values.file).then(() => { el.lastChild.textContent = 'Copied'; }),
};
for (const el of page.querySelectorAll('button, a')) {
  const text = label(el);
  if (text === 'Send report' || text === 'View certificate') { el.remove(); continue; }
  if (text.startsWith('Proceed to')) {
    el.setAttribute('href', '#');
    el.addEventListener('click', (e) => { e.preventDefault(); send('proceedUnsafe', { url }); });
    continue;
  }
  if (text === 'Network settings' && !isMac) { el.remove(); continue; }
  const action = Object.entries(actions).find(([name]) => text === name || text.startsWith(name));
  if (action) el.addEventListener('click', (e) => { e.preventDefault(); action[1](el); });
}

// "Advanced" (certificate) shows or hides the panel.
const advanced = [...page.querySelectorAll('button')].find((b) => label(b).startsWith('Advanced'));
const panel = page.querySelector('#advanced-panel');
if (advanced && panel) {
  const set = (open) => { panel.hidden = !open; advanced.setAttribute('aria-expanded', String(open)); };
  set(false);
  advanced.addEventListener('click', () => set(panel.hidden));
}

// "Details" shows the raw error.
const detailsButton = [...page.querySelectorAll('button')].find((b) => label(b).startsWith('Details'));
if (detailsButton) {
  const box = document.createElement('div');
  box.id = 'details';
  box.hidden = true;
  box.textContent = [`URL: ${url}`, `Error: ${code}`, raw && `Details: ${raw}`].filter(Boolean).join('\n');
  page.firstElementChild.append(box);
  detailsButton.addEventListener('click', () => {
    box.hidden = !box.hidden;
    detailsButton.setAttribute('aria-expanded', String(!box.hidden));
  });
}

// Offline: count down and retry, or retry as soon as the network is back.
if (kind === 'offline') {
  const counter = page.querySelector('[data-countdown]');
  let left = 8;
  const tick = () => {
    if (navigator.onLine && left <= 0) { send('retry'); return; }
    left = left <= 0 ? 8 : left - 1;
    if (counter) counter.textContent = `${left} s`;
    setTimeout(tick, 1000);
  };
  setTimeout(tick, 1000);
  window.addEventListener('online', () => send('retry'));
}

document.title = (page.querySelector('h1') || {}).textContent || 'Error';
</script>
</body>
</html>
