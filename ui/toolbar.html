<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The panel can call cefQuery, so it may load only its own inline scripts and
     styles, the embedded font, and tab favicons. It makes no network requests. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: http: data:; font-src data:">
<title>Rustium toolbar</title>
<style>
  /*@font-geist*/

  /* Design tokens: docs/design/Components.dc.html (dark theme). */
  :root {
    /* Must match TOOLBAR_HEIGHT in src/ui.rs. */
    --toolbar-height: 80px;
    --strip-height: 38px;
    /* Window buttons with a 44px title bar take ~93px, plus a gap. */
    --traffic-lights-width: 104px;

    --window: #0e0f13;      /* = CHROME_BG in src/shell.rs */
    --toolbar: #1d2027;
    --field: #121419;
    --page: #16181e;
    --raised: #22252d;
    --raised-row: #2a2e37;
    --text: #eceef3;
    --secondary: #c9cdd6;
    --dim: #9aa0ad;
    --disabled-text: #6b7180;
    --disabled-icon: #4a4f5c;
    --accent: #8b7cff;
    --success: #5ee6b8;
    --warning: #fbbf24;
    --danger: #ff8a80;
    --hover: rgba(255, 255, 255, .06);
    --pressed: rgba(255, 255, 255, .1);
    color-scheme: dark;
  }
  /* Inactive window: text drops one step, favicons fade (Linux.dc.html). */
  .inactive {
    --text: #9aa0ad;
    --secondary: #6b7180;
    --dim: #6b7180;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: var(--toolbar-height);
    overflow: hidden;
    background: var(--window);
    color: var(--text);
    font: 13px/1.2 Geist, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  button {
    font: inherit;
    color: inherit;
    border: 0;
    padding: 0;
    background: transparent;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  svg { flex: none; }

  /* ---------- Tab strip ---------- */
  #strip {
    height: var(--strip-height);
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 0 8px;
  }
  /* macOS: no title bar. The window buttons sit on the left, the empty part
     of the strip drags the window (see on_draggable_regions_changed). */
  .frameless #strip {
    padding-left: var(--traffic-lights-width);
    -webkit-app-region: drag;
  }
  .frameless.fullscreen #strip { padding-left: 8px; }
  .frameless .tab, .frameless #new-tab { -webkit-app-region: no-drag; }

  #tabs {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    min-width: 0;
    overflow: hidden;
  }
  .tab {
    flex: 0 1 220px;
    min-width: 36px;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 6px 0 12px;
    border-radius: 9px 9px 0 0;
    color: var(--dim);
    transition: background-color .12s;
  }
  .tab:hover { background: var(--page); }
  .tab.active { background: var(--toolbar); color: var(--text); }
  .tab .icon { width: 16px; height: 16px; display: grid; place-items: center; flex: none; }
  .tab .icon > * { grid-area: 1 / 1; }
  .tab .icon img { width: 16px; height: 16px; border-radius: 4px; display: none; }
  .inactive .tab .icon img { opacity: .6; }
  .tab.has-favicon .icon img { display: block; }
  .tab.has-favicon .icon .globe { display: none; }
  .tab .spinner {
    display: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .1);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  .tab.loading .spinner { display: block; }
  .tab.loading .icon img, .tab.loading .icon .globe { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tab .spinner { animation-duration: 2.4s; } }
  .tab .title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .tab.active .title { font-weight: 500; }
  .tab .close {
    width: 20px; height: 20px;
    border-radius: 6px;
    display: grid; place-items: center;
    color: var(--dim);
    flex: none;
    visibility: hidden;
  }
  .tab:hover .close, .tab.active .close { visibility: visible; }
  .tab .close:hover { background: var(--hover); color: var(--text); }
  /* Narrow tab: icon only; the active one keeps its close button. */
  .tab.narrow { padding: 0; justify-content: center; gap: 4px; }
  .tab.narrow .title, .tab.narrow:not(.active) .close { display: none; }

  #new-tab {
    width: 28px; height: 28px;
    margin: 0 0 3px 2px;
    border-radius: 8px;
    display: grid; place-items: center;
    color: var(--dim);
    flex: none;
  }
  #new-tab:hover { background: var(--hover); color: var(--text); }
  #new-tab:active { background: var(--pressed); }

  /* ---------- Navigation bar ---------- */
  #bar {
    position: relative;
    height: calc(var(--toolbar-height) - var(--strip-height));
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 8px;
    background: var(--toolbar);
  }
  .nav {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: grid; place-items: center;
    color: var(--secondary);
    flex: none;
  }
  .nav:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .nav:active:not(:disabled) { background: var(--pressed); }
  .nav:disabled { color: var(--disabled-icon); }
  .nav[aria-expanded="true"] { background: var(--pressed); color: var(--text); }
  #reload .icon-stop { display: none; }
  #reload.stop .icon-stop { display: block; }
  #reload.stop .icon-reload { display: none; }

  #omnibox {
    flex: 1;
    min-width: 0;
    height: 30px;
    margin: 0 6px;
    padding: 0 6px 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 9px;
    background: var(--field);
  }
  #omnibox:focus-within { box-shadow: 0 0 0 2px var(--toolbar), 0 0 0 4px var(--accent); }

  /* Left of the address: search icon or the site security badge. */
  #site { flex: none; display: flex; align-items: center; }
  #site > * { display: none; }
  #omnibox[data-security="none"] #site .search,
  #omnibox:focus-within #site .search { display: grid; }
  #omnibox:focus-within #site > :not(.search) { display: none !important; }
  #omnibox[data-security="secure"] #site .lock { display: flex; }
  #omnibox[data-security="insecure"] #site .insecure { display: flex; }
  #omnibox[data-security="certError"] #site .cert { display: flex; }
  #omnibox[data-security="internal"] #site .internal { display: flex; }
  #site .search { width: 26px; place-items: center; color: var(--dim); }
  #omnibox:focus-within #site .search { color: var(--secondary); }
  #site .lock {
    height: 24px; padding: 0 7px;
    border-radius: 7px;
    align-items: center;
    color: var(--dim);
  }
  .chip {
    height: 22px; padding: 0 8px;
    border-radius: 6px;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .chip.insecure { background: rgba(251, 191, 36, .12); color: var(--warning); }
  .chip.cert { background: rgba(255, 138, 128, .14); color: var(--danger); }
  .chip.internal { background: var(--raised); color: var(--secondary); }
  /* Page zoom other than 100%: icon and text on the right, click resets it. */
  #zoom-chip {
    display: flex;
    flex: none;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 6px;
    border-radius: 7px;
    color: var(--dim);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  #zoom-chip:hover { color: var(--text); }
  /* Site permissions: a pending request (accent, click reopens it) or the
     camera/microphone in use (red dot). */
  #perm-chip {
    display: flex;
    flex: none;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 8px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
  }
  #perm-chip[hidden] { display: none; }
  #perm-chip.pending { background: rgba(139, 124, 255, .16); color: #b4abff; }
  #perm-chip.pending:hover { background: rgba(139, 124, 255, .24); }
  #perm-chip.live { background: rgba(255, 138, 128, .12); color: var(--danger); cursor: default; }
  #perm-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  #perm-chip.pending .dot { display: none; }

  .field { position: relative; flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; }
  #address {
    width: 100%;
    border: 0;
    outline: none;
    padding: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 13.5px;
    caret-color: var(--accent);
    user-select: text;
    -webkit-user-select: text;
  }
  #address::placeholder { color: var(--disabled-text); }
  #address::selection { background: rgba(139, 124, 255, .35); }
  /* The URL without focus: dim scheme and path, bright host. It lies over
     the input; the input text is hidden meanwhile. */
  #pretty {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    pointer-events: none;
    color: var(--dim);
  }
  #pretty .host { color: var(--text); }
  #pretty s { color: var(--danger); }
  .show-pretty #pretty { display: flex; }
  .show-pretty #address { color: transparent; }

  /* Downloads button: ring with total progress, badge after finishing. */
  #downloads { position: relative; }
  #downloads .ring { position: absolute; left: 1px; top: 1px; display: none; }
  #downloads .ring .value { transition: stroke-dasharray .3s ease-out; }
  #downloads .badge {
    position: absolute;
    right: 2px; bottom: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid var(--toolbar);
    display: none;
    place-items: center;
  }
  #downloads[data-badge="progress"] .ring { display: block; }
  #downloads[data-badge="progress"] .arrow { width: 13px; height: 13px; }
  #downloads[data-badge="complete"] .badge { display: grid; background: var(--success); }
  #downloads[data-badge="failed"] .badge { display: grid; background: var(--danger); }
  #downloads[data-badge="complete"] .badge .fail,
  #downloads[data-badge="failed"] .badge .ok { display: none; }

  #progress {
    position: absolute;
    left: 0; bottom: 0;
    height: 2px;
    width: 0;
    background: var(--accent);
    opacity: 0;
    transition: width .2s ease-out, opacity .3s;
  }
</style>
</head>
<body>
  <div id="strip">
    <div id="tabs" role="tablist" aria-label="Tabs"></div>
    <button id="new-tab" aria-label="New tab">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="bar">
    <button class="nav" id="back" aria-label="Back" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <button class="nav" id="forward" aria-label="Forward" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <button class="nav" id="reload" aria-label="Reload">
      <svg class="icon-reload" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      <svg class="icon-stop" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>

    <div id="omnibox" data-security="none">
      <div id="site">
        <span class="search" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </span>
        <span class="lock" role="img" aria-label="Connection is secure">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <span class="chip insecure">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4M12 17v.01"/></svg>Not secure
        </span>
        <span class="chip cert">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-1.9"/><path d="M3 3l18 18"/></svg>Not secure
        </span>
        <span class="chip internal">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/></svg>Rustium
        </span>
      </div>
      <div class="field">
        <input id="address" type="text" spellcheck="false" autocomplete="off"
               aria-label="Address" placeholder="Search or enter address">
        <div id="pretty" aria-hidden="true"></div>
      </div>
      <button id="perm-chip" hidden>
        <span class="dot" aria-hidden="true"></span>
        <svg class="icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg><span class="text"></span>
      </button>
      <button id="zoom-chip" hidden>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span></span>
      </button>
    </div>

    <button class="nav" id="downloads" aria-label="Downloads" aria-haspopup="dialog" aria-expanded="false" hidden>
      <svg class="ring" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <circle cx="14" cy="14" r="12" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="2"/>
        <circle class="value" cx="14" cy="14" r="12" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 75.4" transform="rotate(-90 14 14)"/>
      </svg>
      <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span class="badge" aria-hidden="true">
        <svg class="ok" width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="#0e0f13" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
        <svg class="fail" width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="#0e0f13" stroke-width="4.5" stroke-linecap="round"><path d="M12 5v8M12 18v.5"/></svg>
      </span>
    </button>
    <button class="nav" id="menu" aria-label="Main menu" aria-haspopup="menu" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
    <div id="progress" role="progressbar" aria-label="Page loading"></div>
  </div>

<template id="tab-template">
  <div class="tab" role="tab">
    <span class="icon">
      <span class="spinner"></span>
      <img alt="" referrerpolicy="no-referrer">
      <svg class="globe" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
    </span>
    <span class="title"></span>
    <button class="close" aria-label="Close tab">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</template>

<script>
'use strict';

const isMac = navigator.platform.toUpperCase().includes('MAC');
const mod = isMac ? '⌘' : 'Ctrl+';
// Must match FRAMELESS in src/views.rs.
document.documentElement.classList.toggle('frameless', isMac);

const $ = (sel) => document.querySelector(sel);
const tabsEl = $('#tabs');
const omniboxEl = $('#omnibox');
const addressEl = $('#address');
const prettyEl = $('#pretty');
const backEl = $('#back');
const forwardEl = $('#forward');
const reloadEl = $('#reload');
const progressEl = $('#progress');
const downloadsEl = $('#downloads');
const menuEl = $('#menu');
const RING = 75.4; // 2π·12, the ring circumference
const template = $('#tab-template');

/** State from Rust: { tabs: [{id, title, url, favicon, loading, progress,
 *  canGoBack, canGoForward, security}], active, fullscreen, windowActive } */
let state = { tabs: [], active: null };
let lastActive = null;
/** The user typed something in the address bar: don't overwrite it. */
let editing = false;
const tabEls = new Map();

// ---------------------------------------------------------------------------
// Talking to Rust
// ---------------------------------------------------------------------------

function query(cmd, extra = {}) {
  return new Promise((resolve, reject) => {
    if (typeof window.cefQuery !== 'function') {
      reject(new Error('cefQuery is not available'));
      return;
    }
    window.cefQuery({
      request: JSON.stringify({ cmd, ...extra }),
      onSuccess: resolve,
      onFailure: (code, message) => reject(new Error(`${cmd}: ${code} ${message}`)),
    });
  });
}

function send(cmd, extra) {
  query(cmd, extra).catch((err) => console.error(err.message));
}

// Rust calls these through execute_java_script.
window.rustium = {
  update(next) {
    state = next;
    const root = document.documentElement.classList;
    root.toggle('fullscreen', !!state.fullscreen);
    root.toggle('inactive', state.windowActive === false);
    if (state.active !== lastActive) {
      lastActive = state.active;
      editing = false;
    }
    render();
  },
  focusAddress() {
    addressEl.focus();
    addressEl.select();
  },
  /** Open the downloads list under its button (a download started, or the menu item). */
  /** Show the active tab's permission request under the address bar. */
  openPermission() {
    requestAnimationFrame(() => showPopup('permission', omniboxEl));
  },
  openDownloads() {
    // The button may have just appeared: wait for layout.
    requestAnimationFrame(() => showPopup('downloads', downloadsEl.hidden ? menuEl : downloadsEl));
  },
};

/** Ask Rust to open a popup under `button` (toolbar coordinates = window coordinates). */
function showPopup(kind, button) {
  const r = button.getBoundingClientRect();
  send('showPopup', { kind, anchor: { x: r.x, y: r.y, width: r.width, height: r.height } });
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function activeTab() {
  return state.tabs.find((t) => t.id === state.active);
}

function render() {
  renderTabs();
  renderBar();
}

function renderTabs() {
  const ids = new Set(state.tabs.map((t) => t.id));
  for (const [id, el] of tabEls) {
    if (!ids.has(id)) {
      el.remove();
      tabEls.delete(id);
    }
  }
  state.tabs.forEach((tab, index) => {
    let el = tabEls.get(tab.id);
    if (!el) {
      el = createTab(tab.id);
      tabEls.set(tab.id, el);
    }
    updateTab(el, tab);
    if (tabsEl.children[index] !== el) {
      tabsEl.insertBefore(el, tabsEl.children[index] || null);
    }
  });
  requestAnimationFrame(markNarrowTabs);
}

function createTab(id) {
  const el = template.content.firstElementChild.cloneNode(true);
  el.dataset.id = String(id);
  const img = el.querySelector('img');
  img.addEventListener('load', () => el.classList.add('has-favicon'));
  img.addEventListener('error', () => el.classList.remove('has-favicon'));

  el.addEventListener('mousedown', (e) => {
    if (e.button === 0 && !e.target.closest('.close')) send('selectTab', { id });
  });
  // Middle click closes the tab.
  el.addEventListener('auxclick', (e) => {
    if (e.button === 1) {
      e.preventDefault();
      send('closeTab', { id });
    }
  });
  const close = el.querySelector('.close');
  close.addEventListener('click', (e) => {
    e.stopPropagation();
    send('closeTab', { id });
  });
  close.title = `Close tab (${mod}W)`;
  return el;
}

function updateTab(el, tab) {
  const active = tab.id === state.active;
  el.classList.toggle('active', active);
  el.classList.toggle('loading', tab.loading);
  el.setAttribute('aria-selected', String(active));
  el.setAttribute('aria-busy', String(tab.loading));
  el.title = tab.title;
  // textContent, not innerHTML: the title comes from the page.
  const title = el.querySelector('.title');
  if (title.textContent !== tab.title) title.textContent = tab.title;

  const img = el.querySelector('img');
  const favicon = tab.favicon || '';
  if (img.dataset.src !== favicon) {
    img.dataset.src = favicon;
    el.classList.remove('has-favicon');
    if (favicon) img.src = favicon;
    else img.removeAttribute('src');
  }
}

function markNarrowTabs() {
  for (const el of tabEls.values()) {
    el.classList.toggle('narrow', el.getBoundingClientRect().width < 72);
  }
}

/** When focus moves to the page, the panel document loses focus but
 *  activeElement still points at the input, so check both. */
function addressFocused() {
  return document.hasFocus() && document.activeElement === addressEl;
}

/** Splits a URL into the dim scheme, the bright host and the dim rest. */
function prettyParts(url) {
  const m = /^([a-z][a-z0-9+.-]*:\/\/)([^/?#]*)(.*)$/i.exec(url);
  return m ? { scheme: m[1], host: m[2], rest: m[3] } : null;
}

function renderPretty(url, security) {
  prettyEl.textContent = '';
  const parts = prettyParts(url);
  if (!parts) {
    prettyEl.append(url);
    return;
  }
  if (security === 'certError' && parts.scheme.toLowerCase() === 'https://') {
    const s = document.createElement('s');
    s.textContent = 'https';
    prettyEl.append(s, '://');
  } else {
    prettyEl.append(parts.scheme);
  }
  const host = document.createElement('span');
  host.className = 'host';
  host.textContent = parts.host;
  prettyEl.append(host, parts.rest);
}

function renderBar() {
  const tab = activeTab();
  backEl.disabled = !(tab && tab.canGoBack);
  forwardEl.disabled = !(tab && tab.canGoForward);
  const loading = !!(tab && tab.loading);
  reloadEl.classList.toggle('stop', loading);
  reloadEl.setAttribute('aria-label', loading ? 'Stop loading' : 'Reload');
  reloadEl.title = loading ? 'Stop loading' : `Reload (${mod}R)`;

  const url = tab ? tab.url : '';
  const security = (tab && tab.security) || 'none';
  omniboxEl.dataset.security = security;
  if (!editing && addressEl.value !== url) addressEl.value = url;
  renderPretty(url, security);
  omniboxEl.classList.toggle('show-pretty', !addressFocused() && !editing && url !== '');

  renderDownloadsButton();
  renderZoomChip();
  renderPermissionChip(tab);
  menuEl.setAttribute('aria-expanded', String(state.popup === 'menu'));

  if (loading) {
    progressEl.style.opacity = '1';
    progressEl.style.width = `${Math.max(8, Math.round((tab.progress || 0) * 100))}%`;
  } else {
    progressEl.style.opacity = '0';
    progressEl.style.width = '100%';
  }
}

const PERM_LABELS = {
  camera: 'Camera', microphone: 'Microphone', screen: 'Screen', location: 'Location',
  notifications: 'Notifications', clipboard: 'Clipboard', other: 'Permission',
};
const PERM_ICONS = {
  camera: '<rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/>',
  microphone: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  screen: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  location: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  notifications: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  clipboard: '<rect x="6" y="4.5" width="12" height="16" rx="2"/><path d="M9.5 4.5V3h5v1.5M9.5 10h5M9.5 14h5"/>',
  other: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.01"/>',
};

function renderPermissionChip(tab) {
  const chip = $('#perm-chip');
  const request = tab && tab.permissionPending && state.permission;
  let kind = null;
  let label = '';
  if (request) {
    kind = request.items[0] || 'other';
    label = `${request.host} wants to use your ${PERM_LABELS[kind].toLowerCase()}. Click to answer`;
  } else if (tab && (tab.camera || tab.microphone)) {
    kind = tab.camera ? 'camera' : 'microphone';
    label = tab.camera && tab.microphone
      ? 'This page is using your camera and microphone'
      : `This page is using your ${kind}`;
  }
  chip.hidden = !kind;
  if (!kind) return;
  chip.className = request ? 'pending' : 'live';
  chip.querySelector('.icon').innerHTML = PERM_ICONS[kind];
  chip.querySelector('.text').textContent = PERM_LABELS[kind];
  chip.title = label;
  chip.setAttribute('aria-label', label);
}

function renderZoomChip() {
  const chip = $('#zoom-chip');
  const zoom = state.zoom || 100;
  chip.hidden = zoom === 100 || !activeTab();
  chip.querySelector('span').textContent = `${zoom}%`;
  const label = `Zoom: ${zoom}%. Click to reset to 100%`;
  chip.title = label;
  chip.setAttribute('aria-label', label);
}

function renderDownloadsButton() {
  const badge = state.downloadsBadge || 'hidden';
  downloadsEl.hidden = badge === 'hidden';
  downloadsEl.dataset.badge = badge;
  downloadsEl.setAttribute('aria-expanded', String(state.popup === 'downloads'));
  const list = state.downloads || [];
  const active = list.filter((d) => d.status === 'progress' || d.status === 'paused').length;
  const percent = Math.round((state.downloadsProgress || 0) * 100);
  downloadsEl.querySelector('.ring .value')
    .setAttribute('stroke-dasharray', `${((state.downloadsProgress || 0) * RING).toFixed(1)} ${RING}`);
  const label = {
    progress: `Downloads — ${active} in progress, ${percent}%`,
    complete: 'Downloads — complete',
    failed: 'Downloads — failed',
  }[badge] || 'Downloads';
  downloadsEl.setAttribute('aria-label', label);
  downloadsEl.title = label;
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

$('#new-tab').addEventListener('click', () => send('newTab'));
$('#new-tab').title = `New tab (${mod}T)`;
backEl.addEventListener('click', () => send('back'));
forwardEl.addEventListener('click', () => send('forward'));
reloadEl.addEventListener('click', () => send(reloadEl.classList.contains('stop') ? 'stop' : 'reload'));
menuEl.addEventListener('click', () => showPopup('menu', menuEl));
menuEl.title = 'Main menu';
downloadsEl.addEventListener('click', () => showPopup('downloads', downloadsEl));
$('#zoom-chip').addEventListener('click', () => send('zoomReset'));
$('#perm-chip').addEventListener('click', () => {
  if ($('#perm-chip').classList.contains('pending')) showPopup('permission', omniboxEl);
});
backEl.title = isMac ? 'Back (⌘[)' : 'Back (Alt+←)';
forwardEl.title = isMac ? 'Forward (⌘])' : 'Forward (Alt+→)';

// Double click on the empty strip opens a new tab (on Linux; on macOS the
// system handles double clicks on the drag area).
$('#strip').addEventListener('dblclick', (e) => {
  if (e.target.id === 'strip' || e.target.id === 'tabs') send('newTab');
});

addressEl.addEventListener('focus', () => {
  omniboxEl.classList.remove('show-pretty');
  addressEl.select();
});
addressEl.addEventListener('input', () => { editing = true; });
addressEl.addEventListener('blur', () => {
  editing = false;
  renderBar();
});
addressEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const text = addressEl.value.trim();
    if (!text) return;
    editing = false;
    send('navigate', { url: text });
  } else if (e.key === 'Escape') {
    e.preventDefault();
    editing = false;
    renderBar();
    send('focusContent');
  }
});

// Only the address field gets a context menu (copy and paste).
document.addEventListener('contextmenu', (e) => {
  if (e.target !== addressEl) e.preventDefault();
});
// Nothing can be dropped onto the panel.
for (const type of ['dragover', 'drop']) {
  document.addEventListener(type, (e) => e.preventDefault());
}
window.addEventListener('resize', () => requestAnimationFrame(markNarrowTabs));
// The panel loses or gets focus as a whole (the page took it, or the user
// clicked back into the address field).
window.addEventListener('blur', () => { editing = false; renderBar(); });
window.addEventListener('focus', renderBar);

// Tell Rust the panel is ready and get the initial state.
query('ready')
  .then((json) => window.rustium.update(JSON.parse(json)))
  .catch((err) => console.error(err.message));
</script>
</body>
</html>
